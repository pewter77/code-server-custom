name: Docker Image

on:
  schedule:
    - cron: "5 13 * * 0"
  push:
    branches:
      - main
  # PR check: builds the image without logging in or pushing, then runs each
  # added tool once. Renovate's automerge waits for this.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Find tags
        id: tags
        run: |
          DOCKER_TAG=$(grep -m1 "^FROM" Dockerfile | awk -F':' '{print $NF}')
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Keep the PR build in the local image store for the smoke test
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.docker_tag }}

      - name: Smoke test the added tools
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint sh "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.docker_tag }}" -c '
            set -e
            ansible --version
            ansible-lint --version
            sops --version
            age --version
            claude --version'
